version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: work_bot_hunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn backend.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/work_bot_hunter
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/work_bot_hunter
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - cv_data:/data/cvs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A backend.workers.celery_app worker -l info -c 2
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/work_bot_hunter
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/work_bot_hunter
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
      - cv_data:/data/cvs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A backend.workers.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/work_bot_hunter
      DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/work_bot_hunter
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  cv_data:
